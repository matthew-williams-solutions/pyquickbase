name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI Trusted Publishing, so no API token is stored anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Check the tag matches the package version
        run: |
          version=$(uv run python -c "import pyquickbase; print(pyquickbase.__version__)")
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Run the checks
        run: |
          uv run ruff check .
          uv run pyright
          uv run scripts/generate_sync.py --check
          uv run pytest
      - run: uv build
      - run: uv publish --trusted-publishing always
