site_name: pyquickbase
site_description: An unofficial, typed Python SDK for the Quickbase API, with sync and async clients.
site_url: https://matthew-williams-solutions.github.io/pyquickbase/
repo_url: https://github.com/matthew-williams-solutions/pyquickbase
repo_name: matthew-williams-solutions/pyquickbase
edit_uri: edit/main/docs/
strict: true
copyright: pyquickbase isn't affiliated with or endorsed by Quickbase, Inc.

validation:
  anchors: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Guides:
      - Getting started: getting-started.md
      - Reading records: guides/reading.md
      - Writing records: guides/writing.md
      - File attachments: guides/files.md
      - CSV and Excel files: guides/spreadsheets.md
      - Formulas: guides/formulas.md
      - Changing the schema: guides/schema.md
      - Working with apps: guides/apps.md
      - Handling errors: guides/errors.md
      - Configuring clients: guides/clients.md
  - AI agents:
      - Using pyquickbase from an AI agent: agents/index.md
      - Untrusted input: agents/untrusted-input.md
      - Giving a model operations: agents/operations.md
      - Results and errors: agents/results.md
      - Previews and schema changes: agents/changes.md
  - Policies:
      - Policies: policies/index.md
      - Your first policy: policies/tutorial.md
      - Writing rules: policies/rules.md
      - Classes and new fields: policies/classes.md
      - Limiting rows: policies/rows.md
      - Schema changes: policies/schema.md
      - Rules of your own: policies/custom-rules.md
      - Debugging refusals: policies/debugging.md
      - Recipes: policies/recipes.md
      - What a policy doesn't do: policies/limits.md
  - Reference:
      - Overview: reference/index.md
      - Core:
          - Quickbase: reference/quickbase.md
          - App: reference/app.md
          - Table: reference/table.md
          - Report: reference/report.md
      - Data:
          - Queries: reference/queries.md
          - Records and results: reference/records.md
          - Metadata: reference/metadata.md
          - Field types: field-types.md
      - Schema:
          - Schema changes: reference/schema-changes.md
          - SchemaOperation: reference/schema-operation.md
      - Policies:
          - Policies: reference/policies.md
          - Rules: reference/rules.md
      - AI agents:
          - Operation: reference/operation.md
          - Tools for models: reference/tools.md
      - Errors and retries:
          - Errors: reference/errors.md
          - Retries: reference/retries.md
  - Playground: playground.md
  - Project:
      - Stability and versioning: stability.md
      - Quickbase API notes: api-notes.md
      - Changelog: changelog.md

extra_css:
  - stylesheets/site.css
  - stylesheets/reference.css

extra_javascript:
  - javascripts/reference.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
