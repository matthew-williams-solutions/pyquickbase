site_name: pyquickbase
site_description: An unofficial, typed Python SDK for the Quickbase API, with sync and async clients.
site_url: https://matthew-williams-solutions.github.io/pyquickbase/
repo_url: https://github.com/matthew-williams-solutions/pyquickbase
repo_name: matthew-williams-solutions/pyquickbase
edit_uri: edit/main/docs/
strict: true
copyright: pyquickbase isn't affiliated with or endorsed by Quickbase, Inc.

validation:
  anchors: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Guides:
      - Getting started: getting-started.md
      - How pyquickbase works: guides/how-it-works.md
      - Working with data:
          - Reading records: guides/reading.md
          - Summarizing records: guides/summaries.md
          - Running reports: guides/reports.md
          - Writing records: guides/writing.md
          - File attachments: guides/files.md
          - CSV and Excel files: guides/spreadsheets.md
          - Formulas: guides/formulas.md
      - Apps and schema:
          - Changing the schema: guides/schema.md
          - Working with apps: guides/apps.md
          - Code pages: guides/code-pages.md
      - Running in production:
          - Handling errors: guides/errors.md
          - Configuring clients: guides/clients.md
          - Troubleshooting: guides/troubleshooting.md
      - Recipes: guides/recipes.md
  - AI agents:
      - Using pyquickbase from an AI agent: agents/index.md
      - Untrusted input: agents/untrusted-input.md
      - Giving a model operations: agents/operations.md
      - Results and errors: agents/results.md
      - Previews and schema changes: agents/changes.md
  - Policies:
      - Start here:
          - Policies: policies/index.md
          - Your first policy: policies/tutorial.md
      - Writing a policy:
          - Writing rules: policies/rules.md
          - Tags and new fields: policies/tags.md
          - Rules of your own: policies/custom-rules.md
      - Using a policy:
          - Debugging refusals: policies/debugging.md
          - Recipes: policies/recipes.md
          - What a policy doesn't do: policies/limits.md
  - Reference:
      - Overview: reference/index.md
      - Client and errors:
          - Client: reference/client.md
          - Errors: reference/errors.md
          - Quickbase API calls: api-calls.md
      - Data:
          - Records: reference/records.md
          - Writes: reference/writes.md
          - Queries: reference/queries.md
          - Summaries and formulas: reference/summaries.md
          - Files and spreadsheets: reference/files.md
          - Reports: reference/reports.md
      - Apps and schema:
          - Apps: reference/apps.md
          - Tables: reference/tables.md
          - Fields and relationships: reference/fields.md
          - Schema plans: reference/schema-plans.md
          - Code pages: reference/code-pages.md
          - Links: reference/links.md
          - Field types: field-types.md
      - Policies:
          - Policies: reference/policies.md
          - Rules: reference/rules.md
      - AI agents:
          - Operations for models: reference/operations.md
  - Playground: playground.md
  - Project:
      - Stability and versioning: stability.md
      - Quickbase API notes: api-notes.md
      - Changelog: changelog.md

extra_css:
  - stylesheets/site.css
  - stylesheets/reference.css

extra_javascript:
  - javascripts/reference.js

plugins:
  - search
  - redirects:
      redirect_maps:
        policies/rows.md: policies/rules.md#limiting-rows
        policies/schema.md: policies/rules.md#schema-changes
        reference/quickbase.md: reference/client.md
        reference/app.md: reference/apps.md
        reference/table.md: reference/records.md
        reference/report.md: reference/reports.md
        reference/code-page.md: reference/code-pages.md
        reference/metadata.md: reference/apps.md
        reference/schema-changes.md: reference/schema-plans.md
        reference/app-operation.md: reference/operations.md
        reference/table-operation.md: reference/operations.md
        reference/tools.md: reference/operations.md
        reference/retries.md: reference/client.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
